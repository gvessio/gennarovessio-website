{{ define "main" }}
<section class="page-head">
  <div class="container narrow">
    <p class="eyebrow">Gennaro Vessio</p>
    <h1>{{ .Title }}</h1>
    {{ with .Params.subtitle }}
      <p class="page-subtitle">{{ . }}</p>
    {{ end }}
  </div>
</section>

<section class="page-body">
  <div class="container narrow prose">
    {{ .Content }}
  </div>
</section>
{{ end }}
